  - id: news-2026-06-call2
    title: "Second call for applications: DC2 at NTUA"
    date: 2026-06-15 09:00:00 +0000
    type: news
    excerpt: "A new doctoral position is open: DC2 on coupled chemo-mechanical fatigue damage in corrosive environments, hosted at NTUA, Athens."
    content: |
      The second Met2Adapt call for applications is now open for **Doctoral Candidate 2 (DC2)**, hosted by the National Technical University of Athens.

      **Project:** Coupled chemo-mechanical interactions leading to fatigue damage in corrosive environments. The doctoral candidate will formulate a high-fidelity numerical framework to resolve crack initiation and propagation in components fitted with meta-materials operating in highly corrosive environments, combining fracture mechanics, multi-physics modelling and verification and validation.

      Applicants must meet the eligibility rules of Marie Skłodowska-Curie Doctoral Networks. Details of the position and how to apply are on our [recruitment page](/recruitment/).
    image: "/img/news/call-2.jpg"
    external_url: ""

  - id: news-2026-08-call3
    title: "Third call for applications: DC6 at the University of Trento"
    date: 2026-08-19 09:00:00 +0000
    type: news
    excerpt: "A new doctoral position is open: DC6 on self-tuning variable length systems for the vibration reduction of wind blades, hosted at the University of Trento."
    content: |
      The third Met2Adapt call for applications is now open for **Doctoral Candidate 6 (DC6)**, hosted by the University of Trento.

      **Project:** Self-tuning variable length systems for the vibration reduction of wind blades. The doctoral candidate will derive novel dimensionless formulations of the differential-algebraic equations governing the nonlinear dynamics of variable length systems with lumped mass subject to configurational forces, drawing on nonlinear dynamics, space-time formulations and high-cycle fatigue.

      Applicants must meet the eligibility rules of Marie Skłodowska-Curie Doctoral Networks. Details of the position and how to apply are on our [recruitment page](/recruitment/).
    image: "/img/news/call-3.jpg"
    external_url: ""

