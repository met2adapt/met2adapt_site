# Glossary: terms are explained in a small pop-up the first time they appear on a page,
# and listed in full on the MetaFun page. "match" lists the spellings to recognise.
- term: "Meta-material"
  match: ["meta-materials", "Meta-materials", "meta-material", "metamaterials", "metamaterial"]
  text: "An engineered material whose properties come from its designed internal architecture, the shape and arrangement of small building blocks, rather than from its chemical composition. This allows behaviour not found in ordinary materials, such as blocking waves in certain frequency ranges."
- term: "Meta-structure"
  match: ["meta-structures", "meta-structure", "metastructures", "metastructure", "metastructural"]
  text: "Clusters of structures designed to control how vibrations and waves are transmitted."
- term: "Band gap"
  match: ["band gaps", "band gap", "bandgaps", "bandgap"]
  text: "A range of frequencies in which waves cannot travel through a periodic or resonant material, so vibrations in that range are strongly attenuated."
- term: "Local resonator"
  match: ["local resonators", "local resonator", "local resonance", "locally resonant"]
  text: "A small oscillator embedded in a material. Near its own natural frequency it moves against the host material and absorbs its motion, opening a band gap even at low frequencies."
- term: "Vibration mitigation"
  match: ["vibration mitigation", "vibration reduction", "vibration-attenuating"]
  text: "Reducing unwanted vibrations of a structure, for example by damping, isolation or wave-blocking meta-materials, to extend its service life and improve safety."
- term: "Structural Health Monitoring (SHM)"
  match: ["Structural Health Monitoring", "structural health monitoring", "SHM"]
  text: "Continuous or periodic assessment of a structure's condition using sensors and data analysis, to detect damage early and support maintenance decisions."
- term: "Digital twin"
  match: ["Digital Twins", "digital twins", "Digital Twin", "digital twin", "Digital Twinning"]
  text: "A virtual model of a physical asset that is updated with measured data, so it mirrors the asset's current state and can predict its future behaviour."
- term: "Fatigue"
  match: ["fatigue"]
  text: "Progressive damage caused by repeated (cyclic) loading. It can lead to cracking and failure even when each individual load is well below the material's static strength."
- term: "Phase-field model"
  match: ["phase-field", "phase field"]
  text: "A modelling approach that represents a crack as a smooth damage field rather than a sharp discontinuity, which makes complex crack growth easier to simulate."
- term: "Finite element method"
  match: ["finite element method", "finite elements", "finite element", "FE models"]
  text: "A numerical method that divides a structure into many small elements to compute how it deforms, vibrates or fails under load."
- term: "Wave energy converter"
  match: ["wave energy converters", "wave energy converter", "wave-energy converters", "ocean energy conversion devices", "WECs"]
  text: "A device that captures the energy of ocean surface waves and converts it into electricity."
- term: "Offshore wind"
  match: ["offshore wind farms", "offshore wind", "off-shore"]
  text: "Wind turbines installed at sea, where winds are stronger and steadier than on land. They must withstand demanding loads from wind, waves and corrosion."
- term: "Uncertainty quantification"
  match: ["uncertainty quantification", "Uncertainty Quantification"]
  text: "Methods that describe how uncertainty in inputs, such as loads, material properties or models, affects predictions, so results come with confidence bounds."
- term: "Physics-informed AI"
  match: ["physics-informed AI", "Physics informed AI", "Physics-informed AI", "fusing physics and AI"]
  text: "Machine-learning models constrained by known physical laws, so they need less data and give physically consistent predictions."
- term: "Secondment"
  match: ["secondments", "secondment"]
  text: "A period a Doctoral Candidate spends at another partner organisation, often in industry, to gain complementary skills and experience."
